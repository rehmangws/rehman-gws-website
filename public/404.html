<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REHMAN GWS</title>
  <script>
    (function () {
      var base = '/rehman-gws-website';
      var path = window.location.pathname;

      if (path.indexOf(base + '/') === 0) {
        var route = path.slice(base.length);
        var query = window.location.search;
        var hash = window.location.hash;

        var newUrl = base + '/?/' +
          route.replace(/&/g, '~and~') +
          (query ? '&' + query.slice(1).replace(/&/g, '~and~') : '') +
          hash;

        window.location.replace(newUrl);
      } else {
        window.location.replace(base + '/');
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to REHMAN GWS...</p>
</body>
</html>
